name: Content review reminder

on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:

jobs:
  check-review-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-content-review.mjs
